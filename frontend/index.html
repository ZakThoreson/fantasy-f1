<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      GitHub Pages can't set real CSP response headers, so this meta tag is a
      best-effort defense-in-depth layer — not a substitute for the
      textContent-only DOM rendering used throughout src/render/.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none';"
    />
    <title>Fantasy F1 League Standings</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app" aria-busy="true">
      <div class="skeleton" role="status" aria-label="Loading standings">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line skeleton-meta"></div>
        <div class="skeleton-podium">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
        <div class="skeleton-chart"></div>
        <div class="skeleton-table">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>
      </div>
    </div>
    <footer>
      <p>
        Unofficial fan project. Not affiliated with, endorsed by, or supported by Formula 1, the
        FIA, or F1 Fantasy.
      </p>
      <p>
        <a
          href="https://github.com/ZakThoreson/fantasy-f1"
          target="_blank"
          rel="noopener noreferrer"
          >View source on GitHub</a
        >
      </p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
