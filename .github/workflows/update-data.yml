name: Update League Data

on:
  # No login/credentials involved (see fetchLeague.ts) — just a plain public
  # HTTP request — so there's no downside to polling regularly. The commit
  # step is a no-op when the fetched data hasn't changed.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch league data
        env:
          LEAGUE_ID: '4358307'
          LEAGUE_NAME: "The Paddock Club '26"
        run: npm run fetch -w fetch

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "chore(data): update league standings"
            git push
          fi
